{% extends "base.html" %}

{% block content %}
<div class="dashboard-shell">
    <div class="dashboard-panel">
        <div class="panel-header d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h1>Admin dashboard</h1>
                <p>Operations overview</p>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <a class="btn-pill primary" href="{% url 'profile' %}">View profile</a>
                <a class="btn-pill" href="{% url 'profile_edit' %}">Edit profile</a>
            </div>
        </div>
        <div class="panel-body">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total customers</div>
                    <div class="stat-value">{{ customer_count }}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total admins</div>
                    <div class="stat-value">{{ admin_count }}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Status</div>
                    <div class="stat-value">Online</div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
