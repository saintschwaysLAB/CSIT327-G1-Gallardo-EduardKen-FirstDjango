{% extends "base.html" %}

{% block content %}
<div class="dashboard-shell">
    <div class="dashboard-panel">
        <div class="panel-header d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h1>Welcome, {{ user.first_name|default:user.username }}!</h1>
                <p>Customer dashboard</p>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <a class="btn-pill primary" href="{% url 'profile' %}">View profile</a>
                <a class="btn-pill" href="{% url 'profile_edit' %}">Edit profile</a>
            </div>
        </div>
        <div class="panel-body">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Role</div>
                    <div class="stat-value">{{ user.get_role_display }}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Members</div>
                    <div class="stat-value">{{ member_count }}</div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
