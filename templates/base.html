<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>CampusConnect</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <style>
            body {
                color: #343a40;
                background-color: #f4f4f2 !important;
            }

            .navbar {
                background-color: #fff !important;
                border-bottom: 1px solid #e2e2df;
            }

            .navbar .navbar-brand,
            .navbar .navbar-text {
                color: #343a40 !important;
            }

            .card {
                border-color: #e2e2df;
                background-color: #fff;
            }

            .list-group-item {
                border-color: #e8e8e5;
                background-color: #fff;
            }

            .btn-primary {
                border-color: #555;
                background-color: #555;
            }

            .btn-primary:hover,
            .btn-primary:focus {
                border-color: #343a40;
                background-color: #343a40;
            }

            .btn-outline-primary {
                border-color: #777;
                color: #555;
            }

            .btn-outline-primary:hover,
            .btn-outline-primary:focus {
                border-color: #555;
                background-color: #555;
                color: #fff;
            }

            a {
                color: #555;
            }

            a:hover {
                color: #222;
            }

            .alert-success,
            .alert-info,
            .alert-warning,
            .alert-danger,
            .alert-error {
                border-color: #dededb;
                background-color: #ededeb;
                color: #444;
            }

            .form-control:focus {
                border-color: #888;
                box-shadow: 0 0 0 .2rem rgb(85 85 85 / 15%);
            }
        </style>
    </head>
    <body class="bg-light">
        <nav class="navbar navbar-expand-lg navbar-light bg-white">
            <div class="container">
                <a class="navbar-brand" href="{% if user.is_authenticated %}{% url 'dashboard' %}{% else %}{% url 'login' %}{% endif %}">CampusConnect</a>
                <div class="d-flex align-items-center gap-3">
                    {% if user.is_authenticated %}
                    <span class="navbar-text">Hi, {{ user.username }}!</span>
                    <a class="btn btn-outline-secondary btn-sm" href="{% url 'profile_edit' %}">Edit profile</a>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="btn btn-secondary btn-sm" type="submit">Log out</button>
                    </form>
                    {% else %}
                    <a class="btn btn-outline-secondary btn-sm" href="{% url 'login' %}">Log in</a>
                    <a class="btn btn-secondary btn-sm" href="{% url 'signup' %}">Sign up</a>
                    {% endif %}
                </div>
            </div>
        </nav>
        <main class="container py-4">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
            {% block content %}{% endblock %}
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
